databases:
  - name: fixora-db
    databaseName: fixora
    user: fixora
    plan: free

services:
  - type: web
    name: fixora-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: fixora-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false